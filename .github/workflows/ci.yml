name: 基本检查

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装运行期依赖
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy rawpy tifffile pillow pyflakes
          # tetra3 没有发布到 PyPI，只能从源码装
          pip install git+https://github.com/esa/tetra3@master

      - name: 语法与静态检查
        run: |
          python -m pyflakes src/astro_stack_gui.py tools/build_objects.py tools/build_db_narrow.py
          python -c "import ast; ast.parse(open('src/astro_stack_gui.py', encoding='utf-8').read())"

      - name: 冒烟测试
        run: |
          python src/astro_stack_gui.py --selftest
          python src/astro_stack_gui.py --help

      - name: 单元测试
        run: python tests/run_tests.py

      - name: 许可自查
        shell: bash
        run: |
          # 只扫代码：src/ 与 tools/ 下的 .py 不允许出现 GPL/AGPL 之类的许可字样，
          # 文档里写着"不收 GPL 依赖"是正常的，不参与判定。
          python - <<'PY'
          import pathlib, sys
          bad = []
          for p in list(pathlib.Path("src").rglob("*.py")) + list(pathlib.Path("tools").rglob("*.py")):
              t = p.read_text(encoding="utf-8", errors="ignore").lower()
              for token in ("gnu general public license", "agpl", "proprietary"):
                  if token in t:
                      bad.append(f"{p}: {token}")
          for b in bad:
              print(b)
          sys.exit(1 if bad else 0)
          PY

      - name: 仓库体积自查
        shell: bash
        run: |
          # 单个文件超过 50 MB 会让 git 变慢，星表应当走 Release
          python - <<'PY'
          import pathlib, sys
          big = [p for p in pathlib.Path(".").rglob("*")
                 if p.is_file() and ".git/" not in str(p) and p.stat().st_size > 50 * 1024 * 1024]
          for p in big:
              print(f"{p}: {p.stat().st_size / 1048576:.1f} MB")
          sys.exit(1 if big else 0)
          PY
