name: 基本检查

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装运行期依赖
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy rawpy tifffile pillow pyflakes
          # tetra3 不在 PyPI 主索引时从源码装（见 requirements.txt 注释）
          pip install tetra3 || pip install git+https://github.com/esa/tetra3@master

      - name: 语法与静态检查
        run: |
          python -m pyflakes src/astro_stack_gui.py tools/build_objects.py tools/build_db_narrow.py
          python -c "import ast; ast.parse(open('src/astro_stack_gui.py', encoding='utf-8').read())"

      - name: 冒烟测试
        run: |
          python src/astro_stack_gui.py --selftest
          python src/astro_stack_gui.py --help

      - name: 许可与合规自查
        shell: bash
        run: |
          # data/ 之外的代码与文档不得出现 MIT 以外的许可声明
          python - <<'PY'
          import pathlib, sys
          bad = []
          for p in pathlib.Path(".").rglob("*"):
              if p.suffix.lower() in (".py", ".md", ".txt") and "LICENSES" not in str(p):
                  t = p.read_text(encoding="utf-8", errors="ignore")
                  for token in ("GNU General Public License", "AGPL", "proprietary"):
                      if token.lower() in t.lower() and p.name not in ("THIRD_PARTY_NOTICES.md", "NOTICE.md", "LICENSE"):
                          bad.append(f"{p}: {token}")
          for b in bad:
              print(b)
          sys.exit(1 if bad else 0)
          PY
